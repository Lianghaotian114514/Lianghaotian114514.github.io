<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>食堂抢饭模拟器 // CANTEEN RUSH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root{ --pa:#f4d35e; --pb:#ee964b; --pc:#f95738; --pd:#5fb49c; --pf:#9b8bd6; }
      *{box-sizing:border-box;}
      html,body{height:100%;margin:0;}
      body{background:#0b0d16;color:#e8ecf5;font-family:"Noto Sans SC","PingFang SC",sans-serif;
        overflow:hidden;user-select:none;display:flex;align-items:center;justify-content:center;}
      .px{font-family:"Press Start 2P",monospace;}
      #wrap{position:relative;width:100%;height:100%;max-width:1150px;display:flex;flex-direction:column;}
      #top{flex:none;display:flex;align-items:center;gap:9px;padding:7px 12px;border-bottom:3px solid #2b3148;background:#131726;flex-wrap:wrap;}
      #top b{font-size:13px;letter-spacing:.14em;color:var(--pa);}
      .tag{font-size:10px;padding:3px 7px;border:2px solid #2b3148;background:#1a1f31;color:#9fb0cf;}
      #stageBox{flex:1;min-height:0;position:relative;background:#05070e;display:flex;align-items:center;justify-content:center;overflow:hidden;}
      canvas{display:block;image-rendering:pixelated;}
      #cvT{image-rendering:auto;}
      #bottom{flex:none;border-top:3px solid #2b3148;background:#131726;padding:7px 12px;min-height:70px;}
      #hint{font-size:12px;color:#8fa3c8;line-height:1.65;}

      .dlg{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;width:min(660px,94%);
        background:#141a2b;border:4px solid #e8ecf5;box-shadow:0 0 0 4px #141a2b,0 0 0 7px #2b3148;padding:13px 15px;z-index:20;}
      .dlg .who{font-size:11px;letter-spacing:.2em;color:var(--pa);margin-bottom:6px;}
      .dlg .say{font-size:14px;line-height:1.8;color:#eef3ff;min-height:3em;}
      .dlg .say em{font-style:normal;color:var(--pc);font-weight:700;}
      .dlg .say i{font-style:normal;color:var(--pd);font-weight:700;}
      .btns{display:flex;gap:9px;margin-top:11px;flex-wrap:wrap;}
      .btn{cursor:pointer;border:3px solid #e8ecf5;background:#22293f;color:#eef3ff;font-family:"Noto Sans SC",sans-serif;
        font-size:13px;font-weight:700;padding:9px 17px;box-shadow:4px 4px 0 #0a0d17;transition:all .08s;}
      .btn:hover{background:var(--pa);color:#1b1d2a;}
      .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #0a0d17;}
      .btn.red{border-color:var(--pc);} .btn.red:hover{background:var(--pc);color:#fff;}
      .btn.grn{border-color:var(--pd);} .btn.grn:hover{background:var(--pd);color:#0b1016;}

      #hud{position:absolute;left:9px;top:9px;z-index:15;display:flex;flex-direction:column;gap:4px;}
      .chip{font-size:10px;background:rgba(10,13,23,.84);border:2px solid #2b3148;padding:3px 7px;color:#cfe0ff;}
      .chip b{color:var(--pa);}
      #stam{width:110px;height:8px;border:2px solid #2b3148;background:#0a0d17;}
      #stam>i{display:block;height:100%;background:var(--pd);width:100%;}
      #skills{position:absolute;right:9px;bottom:9px;z-index:16;display:flex;gap:8px;}
      .sk{width:78px;border:3px solid #2b3148;background:rgba(10,13,23,.9);padding:5px;text-align:center;position:relative;overflow:hidden;cursor:pointer;}
      .sk .k{font-family:"Press Start 2P",monospace;font-size:11px;color:var(--pa);}
      .sk .n{font-size:9.5px;color:#cfe0ff;margin-top:3px;line-height:1.3;}
      .sk .cd{position:absolute;left:0;bottom:0;width:100%;background:rgba(249,87,56,.55);transition:height .1s;}
      .sk.ready{border-color:var(--pd);box-shadow:0 0 10px rgba(95,180,156,.5);}
      .sk.off{opacity:.33;cursor:default;}

      #flashTxt{position:absolute;left:50%;top:33%;transform:translate(-50%,-50%);font-size:clamp(19px,4.6vw,42px);
        font-weight:900;letter-spacing:.1em;color:#fff;text-shadow:5px 5px 0 var(--pc);z-index:18;pointer-events:none;opacity:0;white-space:nowrap;}
      @keyframes popin{0%{opacity:0;transform:translate(-50%,-50%) scale(.6);}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08);}
        35%{transform:translate(-50%,-50%) scale(1);}80%{opacity:1;}100%{opacity:0;}}
      .pop{animation:popin 1.5s ease-out;}
      #vig{position:absolute;inset:0;pointer-events:none;z-index:12;background:radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.48) 100%);}
      #scan{position:absolute;inset:0;pointer-events:none;z-index:13;opacity:.08;background:repeating-linear-gradient(0deg,transparent 0 2px,#000 3px,#000 4px);}
      #shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:19;transition:opacity .4s;}
      .hide{display:none !important;}

      /* 格斗 HUD */
      #fight{position:absolute;left:0;right:0;top:0;z-index:17;padding:8px 10px 0;pointer-events:none;}
      .fbar{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
      .fbar .nm{font-size:11px;width:64px;font-family:"ZCOOL QingKe HuangYou",sans-serif;}
      .fhp{flex:1;height:13px;border:2px solid #0a0d17;background:#2a0f14;position:relative;box-shadow:0 0 0 2px #2b3148;}
      .fhp>i{display:block;height:100%;transition:width .18s;}
      .fhp>.dmg{position:absolute;top:0;height:100%;background:rgba(255,255,255,.35);transition:width .5s .18s;}
      .fsp{flex:1;height:6px;border:2px solid #0a0d17;background:#101a2a;box-shadow:0 0 0 2px #2b3148;}
      .fsp>i{display:block;height:100%;background:linear-gradient(90deg,#5fb49c,#7ad7ff);transition:width .15s;}
      #fCombo{position:absolute;left:50%;transform:translateX(-50%);top:54px;font-size:15px;
        font-family:"ZCOOL QingKe HuangYou",sans-serif;color:#f4d35e;opacity:0;}
      #pick{position:absolute;inset:0;z-index:22;background:#0d1120;overflow-y:auto;padding:14px;}
      #pick h2{margin:0 0 3px;text-align:center;font-size:19px;letter-spacing:.14em;color:var(--pa);}
      #pick p.sub{margin:0 0 12px;text-align:center;font-size:10.5px;color:#7f93b8;letter-spacing:.18em;}
      #cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(192px,1fr));gap:10px;max-width:1080px;margin:0 auto;}
      .card{border:3px solid #2b3148;background:#161c2e;padding:10px;cursor:pointer;transition:all .12s;}
      .card:hover{border-color:var(--pa);transform:translateY(-3px);box-shadow:0 6px 0 #0a0d17;}
      .card canvas{margin:0 auto 5px;display:block;}
      .card h3{margin:0 0 1px;font-size:15px;text-align:center;letter-spacing:.08em;}
      .card .role{font-size:9.5px;text-align:center;color:#8fa3c8;margin-bottom:7px;}
      .stat{display:flex;align-items:center;gap:5px;font-size:9.5px;color:#9fb0cf;margin-bottom:3px;}
      .stat span{width:26px;}
      .bar{flex:1;height:6px;border:1px solid #2b3148;background:#0a0d17;}
      .bar>i{display:block;height:100%;}
      .skl{margin-top:7px;font-size:10px;line-height:1.5;color:#cfe0ff;border-top:1px dashed #2b3148;padding-top:6px;}
      .skl b{color:var(--pa);} .skl em{font-style:normal;color:var(--pd);}
      .pas{color:#f4d35e;font-size:9.5px;margin-top:4px;}
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="top">
        <b class="px">CANTEEN RUSH</b>
        <span style="font-size:14px;font-weight:900;">食堂抢饭模拟器</span>
        <span class="tag" id="tagScene">选择角色</span>
        <span class="tag" id="tagClass">第四节：？？？</span>
        <span class="tag" id="tagChar">角色：—</span>
        <span class="tag" style="margin-left:auto;cursor:pointer" id="btnSound">🔊 音效开</span>
        <span class="tag" style="cursor:pointer" id="btnRestart">↺ 重选</span>
      </div>
      <div id="stageBox">
        <div id="holder" style="position:relative;">
          <canvas id="cv" style="position:absolute;left:0;top:0;"></canvas>
          <canvas id="cvT" style="position:absolute;left:0;top:0;pointer-events:none;"></canvas>
        </div>
        <div id="hud" class="hide">
          <div class="chip">用时 <b id="hTime">0.0</b>s</div>
          <div class="chip">撞人 <b id="hHit">0</b></div>
          <div class="chip">体力 <div id="stam"><i></i></div></div>
        </div>
        <div id="skills" class="hide">
          <div class="sk" id="skQ"><div class="k">Q</div><div class="n" id="skQn">—</div><div class="cd" id="skQc"></div></div>
          <div class="sk" id="skE"><div class="k">E</div><div class="n" id="skEn">—</div><div class="cd" id="skEc"></div></div>
        </div>
        <div id="fight" class="hide">
          <div class="fbar"><span class="nm" id="fpN" style="color:#5fb49c">你</span>
            <div class="fhp"><div class="dmg" id="fpD"></div><i id="fpH" style="width:100%;background:linear-gradient(180deg,#8ee6b0,#3f9e6c)"></i></div></div>
          <div class="fbar"><span class="nm" style="color:#8fa3c8;font-size:9px">气力</span>
            <div class="fsp"><i id="fpS" style="width:0%"></i></div></div>
          <div class="fbar"><span class="nm" id="feN" style="color:#f95738">牢电工</span>
            <div class="fhp"><div class="dmg" id="feD"></div><i id="feH" style="width:100%;background:linear-gradient(180deg,#ff9a7a,#c43b22)"></i></div></div>
        </div>
        <div id="fCombo"></div>
        <div id="flashTxt"></div><div id="vig"></div><div id="scan"></div><div id="shade"></div>
        <div class="dlg hide" id="dlg"><div class="who" id="dWho"></div><div class="say" id="dSay"></div><div class="btns" id="dBtns"></div></div>
        <div id="pick">
          <h2>选 择 你 的 抢 饭 选 手</h2>
          <p class="sub">CHOOSE YOUR FIGHTER · 七名选手 · Q 大招 / E 二技能</p>
          <div id="cards"></div>
        </div>
      </div>
      <div id="bottom"><div id="hint">选择一名角色开始游戏。技能键：<b>Q</b> 大招 · <b>E</b> 二技能（也可点右下角按钮）</div></div>
    </div>

    <script>
    "use strict";
    const CW=320, CH=180, FL=180;
    const $=id=>document.getElementById(id);
    const cv=$("cv"), ctx=cv.getContext("2d");
    const cvT=$("cvT"), tctx=cvT.getContext("2d");
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    const rnd=(a,b)=>a+Math.random()*(b-a);
    const ri=(a,b)=>Math.floor(rnd(a,b+1));
    const pick=a=>a[Math.floor(Math.random()*a.length)];
    const hash=n=>{const v=Math.sin(n*127.1)*43758.5453; return v-Math.floor(v);};

    let SC=3;
    function fit(){
      const b=$("stageBox").getBoundingClientRect();
      SC=Math.max(1,Math.min(6,Math.floor(Math.min(b.width/CW,b.height/CH))||1));
      cv.width=CW; cv.height=CH; cv.style.width=(CW*SC)+"px"; cv.style.height=(CH*SC)+"px";
      ctx.imageSmoothingEnabled=false;
      cvT.width=CW*SC; cvT.height=CH*SC; cvT.style.width=(CW*SC)+"px"; cvT.style.height=(CH*SC)+"px";
      const h=$("holder"); h.style.width=(CW*SC)+"px"; h.style.height=(CH*SC)+"px";
    }
    addEventListener("resize",fit);

    /* ---------- 音效 ---------- */
    let AC=null, SOUND=true;
    const ac=()=>{ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; };
    function beep(f0,f1,d,ty,v,at){
      const a=ac(); if(!a||!SOUND)return;
      const t=a.currentTime+(at||0),o=a.createOscillator(),g=a.createGain();
      o.type=ty||"square"; o.frequency.setValueAtTime(f0,t);
      o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+d);
      g.gain.setValueAtTime(v||.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.02);
    }
    function nz(d,cut,v){
      const a=ac(); if(!a||!SOUND)return;
      const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);
      for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);
      const s=a.createBufferSource(); s.buffer=b;
      const f=a.createBiquadFilter(); f.type="lowpass"; f.frequency.value=cut||900;
      const g=a.createGain(); g.gain.value=v||.1;
      s.connect(f).connect(g).connect(a.destination); s.start();
    }
    const sBell=()=>[880,1174,880,1174].forEach((f,i)=>beep(f,f,.3,"sine",.09,i*.3));
    const sStep=()=>nz(.04,1400,.026);
    const sBonk=()=>{nz(.15,420,.12); beep(150,70,.17,"square",.06);};
    const sOK  =()=>[523,659,784,1046].forEach((f,i)=>beep(f,f,.12,"square",.06,i*.07));
    const sBad =()=>[330,262,196].forEach((f,i)=>beep(f,f*.9,.22,"sawtooth",.07,i*.14));
    const sBlip=f=>beep(f||900,f||900,.05,"square",.04);
    const sAlarm=()=>{for(let i=0;i<4;i++)beep(1200,700,.13,"square",.055,i*.17);};
    const sCash=()=>{[1318,1046].forEach((f,i)=>beep(f,f,.1,"square",.06,i*.09)); nz(.2,2600,.05);};
    const sErr =()=>{beep(220,110,.4,"sawtooth",.08); nz(.3,500,.08);};
    const sZap =()=>{for(let i=0;i<7;i++)beep(rnd(1400,2600),rnd(300,700),.07,"square",.05,i*.045); nz(.5,3200,.1);};
    const sBoom=()=>{nz(.5,320,.2); beep(90,32,.5,"sine",.16);};
    const sSwing=()=>{nz(.18,1800,.1); beep(500,160,.2,"sawtooth",.07);};
    const sStink=()=>{nz(.6,600,.12); beep(160,90,.6,"triangle",.07);};
    const sDash=()=>{nz(.2,2200,.08); beep(700,1500,.14,"square",.04);};
    const sHorn=()=>{beep(420,420,.18,"square",.08); beep(330,330,.22,"square",.08,.18);};
    const sWhistle=()=>{beep(1900,2400,.14,"square",.05); beep(2400,1700,.18,"square",.05,.14);};
    const sClink=()=>{beep(1600,1200,.07,"triangle",.05); beep(2100,1500,.09,"triangle",.04,.06);};

    /* ---------- 像素基元 ---------- */
    const P=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x|0,y|0,Math.max(1,w)|0,Math.max(1,h)|0);};
    const SHIRTS=["#ee964b","#5fb49c","#f95738","#9b8bd6","#5a8fd6","#e0c068","#d67ba8","#7fc77f"];
    function personAt(g,x,y,shirt,ph,flip,hat,sm){
      const s=sm?.78:1, sw=Math.sin(ph)>0?1:0;
      const F=(a,b,w,h,c)=>{g.fillStyle=c;g.fillRect((x+a*s)|0,(y+b*s)|0,Math.max(1,w*s)|0,Math.max(1,h*s)|0);};
      F(3,11+sw,2,5,"#2a3450"); F(5,11+(1-sw),2,5,"#2a3450");
      F(2,4,6,8,shirt); F(1,5,1,5,shirt); F(8,5,1,5,shirt);
      F(3,0,4,4,"#f0c49a"); F(3,0,4,1,"#3a2a22");
      if(hat) F(2,-1,6,2,hat);
      F(flip?3:5,2,1,1,"#2b2b2b");
    }
    const person=(x,y,sh,ph,flip,hat,sm)=>personAt(ctx,x,y,sh,ph,flip,hat,sm);
    function teacher(x,y,col){
      P(x+3,y+12,2,5,"#20263a"); P(x+6,y+12,2,5,"#20263a");
      P(x+2,y+4,8,9,col||"#3d4a6b"); P(x+1,y+5,1,6,col||"#3d4a6b"); P(x+9,y+5,1,6,col||"#3d4a6b");
      P(x+3,y-1,5,5,"#f0c49a"); P(x+3,y-2,5,2,"#4a4a4a");
      P(x+3,y+1,2,1,"#fff"); P(x+6,y+1,2,1,"#fff"); P(x+4,y+1,1,1,"#111"); P(x+7,y+1,1,1,"#111");
    }
    // 单层文字：无描边，仅一点点投影，清爽不花
    function txt(s,x,y,c,size,align){
      const f=Math.max(10,Math.round((size||8)*SC*0.95));
      tctx.font=f+'px "ZCOOL QingKe HuangYou","Noto Sans SC","PingFang SC",sans-serif';
      tctx.textAlign=align||"left"; tctx.textBaseline="top";
      tctx.fillStyle="rgba(6,8,14,.55)";
      tctx.fillText(s,x*SC+Math.max(1,SC*.5),y*SC+Math.max(1,SC*.5));
      tctx.fillStyle=c; tctx.fillText(s,x*SC,y*SC);
    }

    /* ================= 角色（含轰炸八五班人物） ================= */
    const CHARS=[
      { id:"lao",n:"牢电工",role:"生化部首席 · 电力统治",sh:"#f95738",hat:"#f4d35e",spd:1.02,size:1,stam:1.1,
        q:{n:"全楼断电",cd:14,d:"电池短接总闸：<em>全场麻痹6s</em> + <em>自身8s 狂暴提速</em>，撞人也不停"},
        e:{n:"电磁推进",cd:5,d:"电弧推背<em>向前瞬移一大段</em>，沿途电飞所有人"},
        pas:"被动 · 带电体质：<b>冲刺不耗体力</b>，撞到的人反被电晕",tip:"又快又猛，大招一开直接横推。"},
      { id:"xin",n:"李鑫隆",role:"化学部长 · 生化威慑",sh:"#9b8bd6",hat:"#7ad7ff",spd:1.04,size:1,stam:1.05,
        q:{n:"腐爆燃毒弹",cd:17,d:"手持<em>威慑退让</em>，投出后<em>全员逃散</em>，招来纪检部"},
        e:{n:"狂暴板凳",cd:6,d:"裤兜掏板凳<em>抡飞周围所有人</em>"},
        pas:"被动 · 化学防护：<b>免疫洒饭</b>（端盘零失误）",tip:"攻击性最强，端盘稳如老狗。"},
      { id:"wang",n:"王敬起",role:"小个子 · 纯数值怪物",sh:"#5fb49c",hat:"",spd:1.34,size:.6,stam:1.45,
        q:null,e:{n:"缝隙滑铲",cd:4,d:"贴地滑铲<em>1.1s 无敌穿人</em>"},
        pas:"被动 · 人小鬼大：<b>碰撞判定极小、搜查发现率 −40%</b>",tip:"没有大招——纯靠跑得快。"},
      { id:"fan",n:"樊某某",role:"打杂的 · 混乱辅助",sh:"#ee964b",hat:"#e0c068",spd:1.08,size:.85,stam:1.15,
        q:{n:"老师来了！",cd:11,d:"虚张声势，<em>全场顿住3.5s</em>"},
        e:{n:"撒辣条",cd:6,d:"丢辣条<em>吸引附近人聚过去</em>"},
        pas:"被动 · 人缘好：<b>队伍里有熟人，排队速度 +35%</b>",tip:"冷却短、插队快，新手友好。"},
      { id:"li",n:"李听远",role:"班务督察长 · 秩序压制",sh:"#dfe8ff",hat:"#ffffff",spd:1.06,size:1,stam:1.2,
        q:{n:"全体靠右！",cd:13,d:"亮白头盔执法，<em>人群分向两侧让出通道6s</em>"},
        e:{n:"纪律哨",cd:5,d:"短哨<em>定住前方行人</em>并自身加速"},
        pas:"被动 · 督察身份：<b>排队免疫搜查</b>",tip:"课代表不敢查督察长，最稳健。"},
      { id:"ci",n:"刺 史",role:"英语课代表 · 单词压制",sh:"#ffb319",hat:"#8a7555",spd:1.0,size:1,stam:1.25,
        q:{n:"听写突击",cd:13,d:"掏出单词本开始报听写：<em>全场学生低头默写8s</em>，无人敢动"},
        e:{n:"背诵检查",cd:6,d:"抓住前方学生查背诵，<em>把他定在原地</em>，自己趁机穿过"},

      {to:1520,bg:"c2",name:"二楼走廊"},{to:1920,bg:"st",name:"楼梯 2F→1F"},
      {to:2420,bg:"out",name:"操场小道"},{to:2800,bg:"hall",name:"食堂一楼"},
      {to:3200,bg:"up",name:"食堂楼梯 → 二楼"}];
    function toRun(){
      cut({art:"run",dur:2.2,bg:"#2a2f45",sfx:sStep,
        title:G.held?"迟 到 的 冲 刺":"冲 出 教 室",
        sub:G.held?"被拖堂 12 秒，走廊早已挤满了人……":"你是第一个冲出门的人！",
        col:G.held?"#f95738":"#5fb49c"},doRun);
    }
    function doRun(){
      fade(true,()=>{
        G.scene="run"; setScene("冲向食堂");
        R.x=0;R.y=140;R.stun=0;R.obs=[];R.fx=[];R.spawn=0;R.seg=0;R.done=false;
        G.runT=0;G.hits=0;G.stam=1;G.qcd=0;G.ecd=0;
        G.stunAll=0;G.slow=0;G.hold=0;G.flee=0;G.chase=-1;G.invul=0;G.rage=0;G.bait=null;G.part=0;G.ride=0;G.bull=0;
        $("hud").classList.remove("hide");dlgOff();fade(false);skillUI();
        setHint("<b>W/S ↑/↓</b> 闪避 · <b>Shift</b> 冲刺 · <b>Q / E</b> 技能");
        flash("冲 啊！","#5fb49c");});
    }
    const curSeg=()=>{for(let i=0;i<SEGS.length;i++)if(R.x<SEGS[i].to)return i;return SEGS.length-1;};
    function lane(seg){const b=SEGS[seg].bg;
      if(b==="st"||b==="up")return[112,156]; if(b==="out")return[104,166]; return[106,162];}
    function updRun(dt){
      G.runT+=dt;
      G.qcd=Math.max(0,G.qcd-dt);G.ecd=Math.max(0,G.ecd-dt);
      ["stunAll","slow","invul","rage","flee","part","ride","bull","surge"].forEach(k=>G[k]=Math.max(0,G[k]-dt));
      if(G.hold>0){G.hold-=dt; if(G.hold<=0){G.flee=6;G.chase=R.x-150;sBoom();shake(8);
        flash("全员逃散！","#9b8bd6");R.fx.push({t:0,k:"stink",x:R.x+110,y:R.y});
        dlgTemp("校纪检部","「谁放的毒气？！给我追——」",1.8);}}
      if(G.bait){G.bait.t-=dt;if(G.bait.t<=0)G.bait=null;}
      const seg=curSeg();R.seg=seg;const[lo,hi]=lane(seg);
      const freeSprint=(C.id==="lao");               // 被动：带电体质，冲刺不耗体力
      G.sprint=(KEY.ShiftLeft||KEY.ShiftRight)&&(freeSprint||G.stam>.02);
      G.stam=clamp(G.stam+((G.sprint&&!freeSprint)?-dt*.36/C.stam:dt*.26*C.stam),0,1);
      let spd=(R.stun>0?40:112)*C.spd*(G.sprint?1.75:1);
      if(G.ride>0)spd*=2.1; if(G.surge>0)spd*=1.45; if(G.slow>0)spd*=.52; if(G.held)spd*=.97;
      R.x+=spd*dt; if(R.stun>0)R.stun-=dt;
      let dy=0; if(KEY.KeyW||KEY.ArrowUp)dy=-1; if(KEY.KeyS||KEY.ArrowDown)dy=1;
      R.y=clamp(R.y+dy*(G.ride>0?52:86)*dt,lo,hi);
      if(Math.random()<dt*9)sStep();
      if(G.chase>=0){G.chase+=118*dt;
        if(G.chase>R.x+6){G.chase=-1;G.runT+=1.6;sBonk();shake(6);flash("被纪检部拦下！","#f95738");R.stun=.6;}
        else if(G.chase<R.x-320)G.chase=-1;}
      R.spawn-=dt;
      if(R.spawn<=0&&G.flee<=0){
        R.spawn=(G.held?.30:.40)*(SEGS[seg].bg==="out"?1.5:1)*rnd(.7,1.5);
        const t=Math.random(),k=t<.68?"stu":(t<.84?"slow":(t<.95?"prop":"tea"));
        R.obs.push({x:R.x+CW+rnd(0,60),y:rnd(lo,hi),k:k,
          vx:k==="stu"?rnd(-40,-14):(k==="slow"?rnd(10,30):0),
          vy:k==="stu"?rnd(-12,12):0,c:pick(SHIRTS),ph:rnd(0,6),hit:false,stun:0,flee:0});
      }
      for(let i=R.obs.length-1;i>=0;i--){
        const o=R.obs[i];
        if(o.flee>0)o.flee-=dt;
        if(o.stun>0)o.stun-=dt;
        else if(G.flee>0){o.x+=190*dt;o.y+=Math.sin(G.t*9+o.ph)*60*dt;}
        else if(o.flee>0){o.y+=o.vy*dt;}
        else if(G.part>0){ const push=(o.y<(lo+hi)/2?-1:1)*54*dt; o.y=clamp(o.y+push,lo-6,hi+6); o.x+=o.vx*dt; }
        else if(G.bait){const d=G.bait.x-o.x,d2=G.bait.y-o.y,m=Math.hypot(d,d2)||1;o.x+=d/m*72*dt;o.y+=d2/m*72*dt;}
        else{o.x+=o.vx*dt;o.y+=o.vy*dt;if(o.y<lo||o.y>hi)o.vy*=-1;}
        if(o.x<R.x-50||o.x>R.x+CW+170){R.obs.splice(i,1);continue;}
        const hr=10*C.size+4;
        if(!o.hit&&Math.abs(o.x-(R.x+20))<hr&&Math.abs(o.y-R.y)<13*C.size+4){
          if(G.ride>0||G.bull>0){ R.obs.splice(i,1); sBonk(); shake(3); continue; }
          if(G.invul>0) continue;
          // 被动 · 带电体质：撞到的人反被电晕，自己不停
          if(C.id==="lao"&&o.k!=="tea"){ o.stun=3; o.hit=true; sZap(); shake(2);
            flash("电 麻 了！","#7ad7ff"); continue; }
          // 被动 · 课代表威严：学生主动让路，只有老师能挡
          if(C.id==="ci"&&o.k!=="tea"){ o.hit=true; o.stun=2.5; sWhistle();
            flash("同学让一下","#ffb319"); continue; }
          o.hit=true;G.hits++;sBonk();shake(4);
          R.stun=(o.k==="tea"?.55:(o.k==="prop"?.38:.26));
          G.runT+=(o.k==="tea"?.8:.3);
          flash(o.k==="tea"?"撞到老师！":"哎哟！",o.k==="tea"?"#f95738":"#ee964b");
        }
      }
      for(let i=R.fx.length-1;i>=0;i--){R.fx[i].t+=dt;if(R.fx[i].t>.9)R.fx.splice(i,1);}
      if(R.x>=R.len&&!R.done){R.done=true;sOK();toQueue();}
      $("hTime").textContent=(G.runT+G.pen).toFixed(1);
      $("hHit").textContent=G.hits;
      $("stam").firstElementChild.style.width=(G.stam*100)+"%";
      skillUI();
    }
    /* ---- 走廊装饰（按世界坐标确定，滚动平滑） ---- */
    function deco(bg,cam){
      const step=80, i0=Math.floor((cam-80)/step);
      for(let i=i0;i<i0+7;i++){
        const wx=i*step, sx=wx-cam, h1=hash(i), h2=hash(i+99);
        if(sx<-90||sx>CW+90)continue;
        if(bg==="c3"||bg==="c2"){
          // 储物柜
          P(sx+6,62,26,42,"#46506f");P(sx+8,64,10,38,"#5a6484");P(sx+20,64,10,38,"#5a6484");
          P(sx+12,80,3,2,"#cfe0ff");P(sx+24,80,3,2,"#cfe0ff");
          // 窗
          P(sx+40,30,34,40,"#1e2336");P(sx+42,32,30,36,"#5a8fd6");
          ctx.globalAlpha=.25;P(sx+44,34,12,13,"#dff0ff");ctx.globalAlpha=1;
          P(sx+56,30,2,40,"#1e2336");
          // 公告栏 / 灭火器
          if(h1>.6){P(sx+8,34,24,20,"#8a7555");P(sx+10,36,20,16,"#e8e2cf");
            P(sx+12,39,16,2,"#b23a3a");P(sx+12,44,12,1,"#6b6f80");}
          if(h2>.72){P(sx+36,82,6,16,"#b23a3a");P(sx+37,80,4,3,"#5a6484");}
          // 吊灯
          P(sx+30,12,20,4,"#f4d35e");ctx.globalAlpha=.14;P(sx+22,16,36,22,"#f4d35e");ctx.globalAlpha=1;
          // 横幅
          if(h1>.5){P(sx,20,66,8,"#b23a3a");}
        } else if(bg==="st"||bg==="up"){
          for(let s=0;s<6;s++)P(sx+s*13,60+s*8,14,8,"#3c415c");
          P(sx,56,80,3,"#8a90b0");
          for(let s=0;s<4;s++)P(sx+s*20,58,2,12,"#6a7290");
          if(h1>.55){P(sx+20,26,30,24,"#1e2336");P(sx+22,28,26,20,"#46506f");}
        } else if(bg==="out"){
          // 树
          P(sx+14,64,6,24,"#4a3a28");P(sx+4,44,26,22,"#2f6d3a");P(sx+9,36,16,14,"#3a8046");
          // 篮球架
          if(h1>.66){P(sx+54,40,3,48,"#8a90b0");P(sx+46,38,18,10,"#dfe8ff");P(sx+52,48,6,5,"#ee964b");}
          // 跑道线
          P(sx,120,40,2,"#d8d2c0");
        } else {
          // 食堂一楼：餐桌、蒸汽
          P(sx+10,78,40,6,"#8a7555");P(sx+14,84,4,14,"#6b5b43");P(sx+44,84,4,14,"#6b5b43");
          P(sx+16,72,8,5,"#cfd6e6");P(sx+32,72,8,5,"#cfd6e6");
          if(h1>.5){ctx.globalAlpha=.18;P(sx+20,52,16,18,"#dfe8ff");ctx.globalAlpha=1;}
          P(sx+56,26,24,28,"#1d2234");P(sx+58,28,20,24,"#46506f");
        }
      }
    }
    function drawRun(){
      const seg=R.seg,bg=SEGS[seg].bg,cam=R.x;
      // 天地
      if(bg==="out"){
        const g=ctx.createLinearGradient(0,0,0,116);g.addColorStop(0,"#2f6fb0");g.addColorStop(1,"#8fc0e0");
        ctx.fillStyle=g;ctx.fillRect(0,0,CW,116);
        P(250,16,16,16,"#ffe9a8");
        for(let i=0;i<4;i++){const cx=((i*110-cam*.12)%(CW+120)+CW+120)%(CW+120)-60;
          ctx.globalAlpha=.75;P(cx,20+i*9,30,7,"#eaf2ff");P(cx+8,15+i*9,18,7,"#eaf2ff");ctx.globalAlpha=1;}
        P(0,96,CW,20,"#2f5d3a"); P(0,116,CW,64,"#6b6150");
      } else if(bg==="up"||bg==="hall"){
        P(0,0,CW,CH,"#2b3146"); P(0,104,CW,76,"#565a74");
      } else { P(0,0,CW,CH,"#2f3550"); P(0,104,CW,76,"#4d4a5e"); }
      deco(bg,cam);
      // 踢脚线 / 地砖
      const o2=-(cam)%32;for(let x=o2-32;x<CW+32;x+=32)P(x,104,16,2,"#3a3f58");
      const o3=-(cam*1.35)%24;for(let x=o3-24;x<CW+24;x+=24)P(x,170,12,2,bg==="out"?"#5b5244":"#3f3c4d");
      // 技能地面特效
      if(G.stunAll>0)for(let i=0;i<9;i++){const x=(i*41+(G.t*90)%41)%CW;P(x,168,2,2,"#7ad7ff");P(x+3,164,2,2,"#cfeaff");}
      if(G.part>0){ctx.globalAlpha=.2;P(0,R.y-12,CW,24,"#dfe8ff");ctx.globalAlpha=1;}
      if(G.bait){const bx=G.bait.x-cam;P(bx,G.bait.y-3,7,4,"#f95738");P(bx+1,G.bait.y-5,5,2,"#ee964b");}
      // 障碍
      for(const o of R.obs){
        const sx=o.x-cam;if(sx<-20||sx>CW+20)continue;
        if(o.k==="tea")teacher(sx,o.y-16,"#5b3a52");
        else if(o.k==="prop"){P(sx,o.y-6,10,12,"#8a5a2a");P(sx+1,o.y-10,8,5,"#cfd6e6");}
        else person(sx,o.y-16,o.c,o.stun>0?0:G.t*7+o.ph,o.vx>0);
        if(o.stun>0){P(sx+2,o.y-24,2,2,"#7ad7ff");P(sx+6,o.y-26,2,2,"#cfeaff");}
        if(G.flee>0)txt("!",sx+4,o.y-28,"#f4d35e",8,"center");
      }
      for(const f of R.fx){const sx=f.x-cam,p=f.t/.9,r=p*60;
        if(f.k==="boom"){ctx.globalAlpha=1-p;P(sx-r/2,f.y-r/4,r,r/2,"#ee964b");P(sx-r/3,f.y-r/6,r*.66,r/3,"#f4d35e");ctx.globalAlpha=1;}
        else{ctx.globalAlpha=(1-p)*.6;P(sx-r,f.y-r/2,r*2,r,"#9b8bd6");ctx.globalAlpha=1;}}
      if(G.chase>=0){const cxp=G.chase-cam;if(cxp>-30){teacher(cxp,R.y-16,"#7a3b3b");txt("纪检部",cxp+5,R.y-32,"#f95738",8,"center");}}
      // 玩家
      const py=R.y-16,bob=R.stun>0?0:Math.abs(Math.sin(G.t*14))*2;
      if(G.ride>0){ // 三轮车
        P(10,py+10,40,8,"#7fc77f");P(14,py+2,14,10,"#5a8f5a");
        P(14,py+18,7,7,"#2a3450");P(40,py+18,7,7,"#2a3450");P(44,py+4,4,8,"#8a7555");
        person(22,py-4,C.sh,G.t*4,false,C.hat||null);
        for(let i=0;i<4;i++)P(4-i*5,py+14+i,4,1,"rgba(127,199,127,.8)");
      } else {
        if(G.invul>0){ctx.globalAlpha=.55;P(14,py+8,20,6,"#5fb49c");ctx.globalAlpha=1;}
        person(20,py-bob+(G.invul>0&&C.id==="wang"?7:0),C.sh,G.t*(G.sprint?20:13),false,C.hat||null,C.size<.8);
      }
      if(G.hold>0){P(30,py-6,6,8,"#9b8bd6");P(31,py-9,4,3,"#7ad7ff");ctx.globalAlpha=.3;P(0,py-30,CW,60,"#9b8bd6");ctx.globalAlpha=1;}
      if(G.rage>0){ctx.globalAlpha=.7;P(28,py-10,34,5,"#8a5a2a");ctx.globalAlpha=1;}
      if(G.bull>0){ctx.globalAlpha=.5;P(30,py+2,16,12,"#ffb319");ctx.globalAlpha=1;}
      if(G.sprint&&G.ride<=0)for(let i=0;i<3;i++)P(12-i*5,py+6+i,4,1,"rgba(244,211,94,.8)");
      // HUD
      // ===== 顶部信息条 =====
      ctx.globalAlpha=.55;P(0,0,CW,30,"#0a0d17");ctx.globalAlpha=1;
      P(10,20,CW-20,6,"#141a2b");P(11,21,(CW-22)*(R.x/R.len),4,"#f4d35e");
      const seg7=SEGS.map((s,i)=>i).filter(i=>SEGS[i].to<=R.len);
      for(const i of seg7){ const px=10+(CW-22)*(SEGS[i].to/R.len); P(px,18,1,10,"#5a6484"); }
      txt(C.n,10,4,C.sh,9);
      txt("第 "+(seg+1)+"/7 段 · "+SEGS[seg].name,CW/2,4,"#cfe0ff",9,"center");
      txt("距食堂 "+Math.max(0,Math.round((R.len-R.x)/10))+" m",CW-10,4,"#f4d35e",9,"right");
      const tt=(G.runT+G.pen);
      txt("用时 "+tt.toFixed(1)+"s",10,33,tt>34?"#f95738":"#9fb0cf",8);
      txt("撞人 "+G.hits,74,33,"#9fb0cf",8);
      txt(tt<26?"预计队伍：很短 ✦":(tt<34?"预计队伍：一般":"预计队伍：很长 ⚠"),
          CW-10,33,tt<26?"#5fb49c":(tt<34?"#f4d35e":"#f95738"),8,"right");
      // 状态提示
      let sy=45;
      const st=(s,c)=>{txt(s,CW/2,sy,c,9,"center");sy+=12;};
      if(G.surge>0)st("⚡ 狂暴提速 "+G.surge.toFixed(1)+"s","#7ad7ff");
      if(G.stunAll>0)st("全场定身 "+G.stunAll.toFixed(1)+"s","#7ad7ff");
      if(G.slow>0)st("接地中 · 自身减速","#7ad7ff");
      if(G.flee>0)st("全员逃散","#9b8bd6");
      if(G.part>0)st("人群靠右让道","#dfe8ff");
      if(G.ride>0)st("三轮车冲刺！","#7fc77f");
      if(G.invul>0)st("无敌穿人","#5fb49c");
      if(G.chase>=0)st("⚠ 纪检部追击中！","#f95738");
    }

    /* ================= 场景3 排队 + 搜查 ================= */
    const Q={n:0,adv:0,evt:0,round:0,gaze:0,gazeT:0,hiding:false,susp:0,phase:"queue"};
    function toQueue(){
      G.totalT=G.runT+G.pen;
      cut({art:"canteen",dur:2.3,sfx:sOK,title:"抵 达 食 堂 二 楼",
        sub:"用时 "+G.totalT.toFixed(1)+" 秒 —— 队伍有多长，就看这一下了",
        col:"#f4d35e"},doQueue);
    }
    function doQueue(){
      fade(true,()=>{
        G.scene="queue";setScene("食堂二楼 · 排队");
        $("hud").classList.add("hide");fade(false);
        G.qUsed=false;G.qcd=0;G.ecd=0;skillUI();
        Q.n=clamp(Math.round((G.totalT-20)*1.0)+ri(0,3),1,40);
        Q.adv=0;Q.round=0;Q.susp=0;Q.phase="queue";
        if(Q.n>=38){sBad();flash("饭 没 了","#f95738");
          dlg("打饭阿姨","最后一勺红烧肉被前面那个高个子端走了。<br><em>「同学，卖完了。」</em>",
            [{t:"……",c:"red",f:()=>ending("soldout")}]);return;}
        sOK();
        dlg("排队中","你冲上二楼，一个滑铲插进队伍。<br>前面还有 <em>"+Q.n+"</em> 个人。<br>"
          +(G.held?"<i>（都怪那 12 秒拖堂……）</i>":"<i>（位置不错！）</i>"),
          [{t:"开始排队",c:"grn",f:()=>{dlgOff();Q.phase="wait";Q.evt=rnd(1.6,2.6);}}]);
        setHint("排队中…… <b style='color:#f95738'>课代表会来查作业</b>。危急时 <b>Q/E</b> 技能脱身（一次）");
      });
    }
    function updQueue(dt){
      if(Q.phase==="wait"){
        Q.adv+=dt*5.0*(C.id==="fan"?1.35:1);     // 被动 · 人缘好：队伍走得快
        // 保证至少留 1 人，等搜查结束再轮到自己
        if(Q.adv>=1){Q.adv=0;if(Q.n>(Q.round<2?1:0)){Q.n--;sBlip(700+Math.random()*200);}}
        Q.evt-=dt;
        // ★ 修复：队伍剩余过少时也要保证搜查能触发（原先排太快会整段跳过）
        if(Q.round<2&&(Q.evt<=0||Q.n<=2)){
          if(C.id==="li"){ Q.round=2;Q.evt=1e9;
            dlgTemp("课代表","他走过来，看见白色头盔，立正敬礼。<br><em>「督察长好！这边不用查！」</em>",2.2);
            flash("督察身份 · 免检","#dfe8ff");sWhistle();}
          else startSearch();
          return;
        }
        if(Q.n<=0&&Q.round>=2){Q.phase="done";toMenu();}
      } else if(Q.phase==="search"){
        Q.gazeT-=dt;Q.hiding=!!KEY.Space;
        if(Q.gazeT<=0){
          if(Q.gaze===1){Q.gaze=0;Q.gazeT=rnd(1.3,2.2);sBlip(500);Q.round++;
            if(Q.round>=2){Q.phase="wait";Q.evt=1e9;sOK();flash("躲过搜查！","#5fb49c");
              dlgTemp("课代表","「……这边没有。」<br>他转身往别的队伍去了。",1.8);
              setHint("搜查过去了，继续排队。");}}
          else{Q.gaze=1;Q.gazeT=rnd(.9,1.5);sAlarm();}}
        const sm=C.size<.8?.6:1;
        if(Q.gaze===1&&!Q.hiding)Q.susp+=dt*1.15*sm;
        else if(Q.gaze===0&&Q.hiding)Q.susp+=dt*.26;
        else Q.susp=Math.max(0,Q.susp-dt*.75);
        if(Q.susp>=1){Q.phase="done";sErr();shake(7);
          dlg("课代表","他一把拎住你的后领。<br><em>「作业没交，还想吃饭？跟我回去。」</em>",
            [{t:"被拖走…",c:"red",f:()=>ending("caught")}]);}
      }
      skillUI();
    }
    function startSearch(){

      if(G.bait){G.bait.t-=dt;if(G.bait.t<=0)G.bait=null;}

    function fHit(x,y,dmg,toEnemy,kb,stun){
      if(toEnemy){
        if(F.eshield>0){ F.fx.push({k:"guard",x:F.ex,y:FG.ground-26,t:0}); sClink(); fMsg("被格挡！",.8); return; }
        F.ehp=Math.max(0,F.ehp-dmg);
        F.ex=clamp(F.ex+(kb||6),40,290); F.estun=Math.max(F.estun,stun||.28);
        F.pcombo++; F.pcomboT=1.4; F.sp=Math.min(100,F.sp+dmg*1.1);
        F.fx.push({k:"hit",x:x,y:y,t:0}); sBonk(); F.shake=Math.max(F.shake,4);
        if(F.ehp<=0) fWin();
      } else {
        if(F.pblock&&F.pg){ F.php=Math.max(0,F.php-dmg*.22); F.sp=Math.min(100,F.sp+dmg*.6);
          F.fx.push({k:"guard",x:F.px,y:FG.ground-26,t:0}); sClink(); F.shake=Math.max(F.shake,2); return; }
        if(F.pinv>0) return;
        F.php=Math.max(0,F.php-dmg);
        F.px=clamp(F.px-(kb||7),20,270); F.pstun=Math.max(F.pstun,stun||.3);
        F.pcombo=0; F.sp=Math.min(100,F.sp+dmg*.5);
        F.fx.push({k:"hit",x:x,y:y,t:0}); sBonk(); F.shake=Math.max(F.shake,5);
        if(F.php<=0) fLose();
      }
    }

      },heavy?140:80);
    }

    function updFight(dt){
      if(F.intro>0){F.intro-=dt;return;}
      if(F.win)return;
      F.pcd.q=Math.max(0,F.pcd.q-dt); F.pcd.e=Math.max(0,F.pcd.e-dt);
      F.pinv=Math.max(0,F.pinv-dt); F.pstun=Math.max(0,F.pstun-dt);
      F.estun=Math.max(0,F.estun-dt); F.eshield=Math.max(0,F.eshield-dt);
      F.shake=Math.max(0,F.shake-dt*18);
      if(F.msgT>0)F.msgT-=dt;
      if(F.pcomboT>0){F.pcomboT-=dt; if(F.pcomboT<=0)F.pcombo=0;}
      F.sp=Math.min(100,F.sp+dt*4.5);
      // 玩家
      F.pblock=!!(KEY.KeyS||KEY.ArrowDown)&&F.pg&&F.pstun<=0;
      if(F.pt>0){F.pt-=dt; if(F.pt<=0&&F.pst!=="skill")F.pst="idle";}
      if(F.pstun<=0&&!F.pblock&&F.pst==="idle"){
        let mv=0;
        if(KEY.KeyA||KEY.ArrowLeft)mv=-1;
        if(KEY.KeyD||KEY.ArrowRight)mv=1;
        F.pvx=mv*96*C.spd;
        if((KEY.KeyW||KEY.ArrowUp)&&F.pg){F.pvy=-215;F.pg=false;sStep();}
      } else F.pvx*=.8;
      F.px=clamp(F.px+F.pvx*dt,16,276);
      F.pvy+=620*dt; F.py+=F.pvy*dt;
      if(F.py>=FG.ground){F.py=FG.ground;F.pvy=0;F.pg=true;}
      // 敌人 AI（强度高：三阶段）
      const ph=F.ehp/F.emax;
      F.eph=ph>.6?1:(ph>.28?2:3);
      if(F.estun<=0){
        F.eai-=dt*(F.eph===1?.8:(F.eph===2?1.0:1.25));
        const d=F.ex-F.px, ad=Math.abs(d);
        // 移动
        if(F.est==="idle"){
          if(ad>46) F.ex+=(d>0?-1:1)*(F.eph===3?70:56)*dt;
          else if(ad<26) F.ex+=(d>0?1:-1)*46*dt;
          F.ex=clamp(F.ex,30,292);
        }
        if(F.eai<=0&&F.est==="idle"){
          const r=Math.random();
          if(ad<44){
            if(r<.22&&F.eph>=2){ // 三连击（降频）
              F.est="combo"; F.et=1.0; F.eai=rnd(2.0,2.8);
              [0,.26,.54].forEach((d0,i)=>setTimeout(()=>{ if(!F.on||F.win)return;
                if(Math.abs(F.ex-F.px)<48) fHit(F.px+10,FG.ground-28,i===2?7:4,false,i===2?10:4,.2); sSwing(); },d0*1000));
              setTimeout(()=>{if(F.on)F.est="idle";},1000);
            } else if(r<.48){ // 重击（前摇更长，便于格挡）
              F.est="heavy"; F.et=.62; F.eai=rnd(1.7,2.4); sSwing();
              setTimeout(()=>{ if(!F.on||F.win)return;
                if(Math.abs(F.ex-F.px)<50) fHit(F.px+10,FG.ground-28,8,false,12,.36); },360);
              setTimeout(()=>{if(F.on)F.est="idle";},640);
            } else if(r<.62){ F.est="guard"; F.eshield=.7; F.et=.7; F.eai=rnd(1.4,2.0);
              setTimeout(()=>{if(F.on)F.est="idle";},700);
            } else { F.est="light"; F.et=.3; F.eai=rnd(1.2,1.8); sSwing();
              setTimeout(()=>{ if(!F.on||F.win)return;
                if(Math.abs(F.ex-F.px)<46) fHit(F.px+10,FG.ground-28,4,false,6,.2); },170);
              setTimeout(()=>{if(F.on)F.est="idle";},330); }
          } else {
            if(r<.5){ F.est="throw"; F.et=.6; F.eai=rnd(1.8,2.6); sZap();
              F.hits.push({x:F.ex-8,y:FG.ground-30,vx:-138,dmg:5,t:0});
              setTimeout(()=>{if(F.on)F.est="idle";},600);
            } else { F.est="dash"; F.et=.55; F.eai=rnd(2.0,2.8); sDash();
              const dir=(F.px<F.ex)?-1:1;
              const iv=setInterval(()=>{ if(!F.on||F.win){clearInterval(iv);return;}
                F.ex=clamp(F.ex+dir*240*.016,30,292);
                if(Math.abs(F.ex-F.px)<30){ fHit(F.px+10,FG.ground-28,7,false,14,.34); clearInterval(iv); F.est="idle"; } },16);
              setTimeout(()=>{clearInterval(iv); if(F.on)F.est="idle";},550);
            }
          }
          // 三阶段：怒气大招（概率与伤害下调，且有明显预警）
          if(F.eph===3&&Math.random()<.12){
            F.est="ult"; F.et=1.5; F.eai=rnd(3.4,4.4); sBoom(); F.shake=7;
            fMsg("⚠ 牢电工蓄力：「利滚利——给我还！」",2.0);
            setTimeout(()=>{ if(!F.on||F.win)return;
              for(let i=0;i<2;i++) F.hits.push({x:F.ex-10,y:FG.ground-22-i*20,vx:-150,dmg:6,t:0});
            },700);
            setTimeout(()=>{if(F.on)F.est="idle";},1500);
          }
        }
      }
      // 敌方弹幕
      for(let i=F.hits.length-1;i>=0;i--){
        const h=F.hits[i]; h.x+=h.vx*dt; h.t+=dt;
        if(Math.abs(h.x-(F.px+10))<13&&Math.abs(h.y-(F.py-24))<22){
          fHit(F.px+10,FG.ground-28,h.dmg,false,8,.3); F.hits.splice(i,1); continue; }
        if(h.x<-20||h.t>4) F.hits.splice(i,1);
      }
      for(let i=F.fx.length-1;i>=0;i--){F.fx[i].t+=dt; if(F.fx[i].t>.7)F.fx.splice(i,1);}
      // HUD
      $("fpH").style.width=(F.php/F.pmax*100)+"%";
      $("feH").style.width=(F.ehp/F.emax*100)+"%";
      $("fpD").style.width=(F.php/F.pmax*100)+"%";
      $("feD").style.width=(F.ehp/F.emax*100)+"%";
      $("fpS").style.width=F.sp+"%";
      const cb=$("fCombo");
      if(F.pcombo>1){cb.style.opacity=1;cb.textContent=F.pcombo+" COMBO!";}
      else cb.style.opacity=0;
      skillUI();
    }

      P(12,22,124,54,"#1f3b2e");P(14,24,120,50,"#24503c");
      P(170,28,60,42,"#1e2336");P(172,30,56,38,"#2b3b58");
      P(236,52,66,92,"#6b5b43");P(240,56,58,84,"#8a7555");
      // 课桌（背景）
      for(let i=0;i<5;i++){const x=16+i*62; P(x,116,40,7,"#7f6a4c");P(x+3,123,4,10,"#5d4c36");P(x+33,123,4,10,"#5d4c36");}
      P(0,FG.ground,CW,CH-FG.ground,"#4a4335");

        else if(f.k==="gas"){ ctx.globalAlpha=(1-f.t/.7)*.6; P(f.x-40,f.y-26,80,46,"#9b8bd6"); ctx.globalAlpha=1; }

      if(F.pinv>0){ctx.globalAlpha=.55;}
      person(F.px,py-(F.pg?0:2),C.sh,F.pg?G.t*8:0,false,C.hat||null,C.size<.8);
      ctx.globalAlpha=1;
      if(F.pblock){P(F.px+12,py+2,4,16,"#5fb49c");txt("防",F.px+5,py-12,"#5fb49c",8,"center");}
      if(F.pst==="light")P(F.px+10,py+4,16,4,"#dfe8ff");
      if(F.pst==="heavy")P(F.px+10,py+2,26,6,"#f4d35e");

      // 命中星
      for(const f of F.fx) if(f.k==="hit"||f.k==="guard"){
        const r=f.t/.7, s=f.k==="guard"?"#5fb49c":"#f4d35e";

        for(let i=0;i<5;i++){const a=i*1.25+r*4; P(f.x+Math.cos(a)*r*22,f.y+Math.sin(a)*r*18,3,3,s);}

      }

      txt(["","阶段1 · 试探","阶段2 · 连击","阶段3 · 暴走"][F.eph],CW-10,46,
        F.eph===3?"#f95738":"#8fa3c8",8,"right");

          [{t:"再来一次",c:"grn",f:restart}]);
        else if(k==="spilled")dlg("结局 · 全 洒 了","餐盘脱手。<em>"+(G.dish?G.dish.n:"午饭")+"在地上开出一朵花。</em><br>"
          +"你借了钱，欠了债，最后连一口都没吃上。<br><i>食堂阿姨默默递来一张拖把。</i>"+st,[{t:"再来一次",c:"grn",f:restart}]);
        else dlg("结局 · 负 债",(C.id==="lao"
            ?"你回到班里坐下，打开账本。<br><em>债主和债务人在同一张椅子上对视。</em><br>你给自己记了一笔。<br><em>「利息，每分钟 9178 元。」</em>"
            :"你回到班里。<br><em>牢电工正坐在你的座位上，翻你的书包。</em><br>平板、充电宝、半包辣条，被一一登记造册。<br><em>「利息，每分钟 9178 元。」</em>")
          +(G.dish&&G.dish.s>=4?"<br><i>不过那份红烧肉，是真的香。</i>":"")+st,[{t:"再来一次",c:"grn",f:restart}]);
      },700);
    }
    function drawEnd(){
      P(0,0,CW,180,"#15192a");
      if(G.ending==="beatLao"){
        P(0,120,CW,60,"#4a4335");
        P(70,96,80,16,"#7f6a4c");
        // 跪地的牢电工 + 散落账本
        P(176,152,14,8,"#2f3b57");P(178,142,10,10,"#2f3b57");P(180,134,6,6,"#f0c49a");
        for(let i=0;i<5;i++)P(196+i*14,158+Math.sin(i)*3,11,7,"#e8e2cf");
        person(96,104,C.sh,G.t*1.2,true,C.hat||null,C.size<.8);
        if(G.dish){P(104,98,14,4,"#cfd6e6");P(106,95,10,3,G.dish.c);}
        txt("债 务 清 零",CW/2,56,"#5fb49c",16,"center");
        txt("「这笔账，一笔勾销。」",CW/2,80,"#ffd9a8",9,"center");
      }
      else if(G.ending==="debt"){
        P(0,110,CW,70,"#4d4a5e");P(20,96,80,16,"#7f6a4c");
        teacher(44,78,"#2f3b57");txt("牢电工",50,66,"#f4d35e",7,"center");
        for(let i=0;i<4;i++){const x=120+i*26,y=96+Math.sin(G.t*2+i)*2;
          P(x,y,18,14,"#8a7555");P(x+3,y+3,12,8,"#cfd6e6");}
        txt("查 抄 家 产",160,80,"#ee964b",9,"center");
        person(250,94,C.sh,G.t*1.2,true,C.hat||null,C.size<.8);
        const debt=Math.floor((performance.now()-G.debtStart)/60000*9178);
        P(58,14,204,38,"#2a0f0f");P(60,16,200,34,"#3d1414");
        txt("当前欠款",160,19,"#ffb3ac",8,"center");
        txt("¥ "+debt.toLocaleString(),160,29,"#f95738",15,"center");
        txt("利息 9178 元 / 分钟",160,54,"#ee964b",8,"center");
      } else if(G.ending==="spilled"){
        P(0,110,CW,70,"#5a5f78");
        for(let i=0;i<9;i++)P(100+i*12,150+Math.sin(i)*4,10,4,G.dish?G.dish.c:"#ee964b");
        P(128,138,34,6,"#cfd6e6");
        person(90,112,C.sh,0,false,C.hat||null,C.size<.8);
        txt("全 洒 了",160,70,"#f95738",15,"center");
      } else if(G.ending==="soldout"){
        P(0,110,CW,70,"#5a5f78");P(0,100,CW,12,"#8a7555");
        P(120,84,70,18,"#9aa3bb");P(124,88,62,10,"#c9d2e8");
        txt("已 售 罄",155,58,"#f95738",15,"center");
        person(230,84,C.sh,0,true,C.hat||null,C.size<.8);
      } else if(G.ending==="caught"){
        P(0,120,CW,60,"#4a4335");P(90,86,60,34,"#f2eddc");
        txt("空 白 卷",120,96,"#8a8574",10,"center");
        person(60,96,C.sh,0,false,C.hat||null,C.size<.8);teacher(180,92,"#7a3b3b");
      } else {
        P(0,120,CW,60,"#4a4335");
        person(150,100,C.sh,G.t*1.4,false,C.hat||null,C.size<.8);
        txt("肚 子 好 饿",160,68,"#f4d35e",13,"center");
      }
    }

    /* ================= 循环 ================= */
    function onPress(code){
      if(G.scene==="fight"){
        if(code==="KeyJ")fPlayerAttack(false);
        if(code==="KeyK")fPlayerAttack(true);
        if(code==="KeyQ")fSkillQ();
        if(code==="KeyE")fSkillE();
        return;
      }
      if(code==="KeyQ"){useQ();return;}
      if(code==="KeyE"){useE();return;}
      if(code!=="Space")return;
      if(G.scene==="class")pressClass();
      else if(G.scene==="menu")lockMenu();
    }
    function loop(now){
      requestAnimationFrame(loop);
      const dt=Math.min(.05,(now-G.last)/1000||.016);G.last=now;G.t+=dt;
      if(tempT>0){tempT-=dt;if(tempT<=0)dlgOff();}
      if(G.scene==="class")updClass(dt);
      else if(G.scene==="run")updRun(dt);
      else if(G.scene==="queue")updQueue(dt);
      else if(G.scene==="menu")updMenu(dt);
      else if(G.scene==="tray")updTray(dt);
      else if(G.scene==="fight")updFight(dt);
      else if(G.scene==="cut")updCut(dt);
      tctx.clearRect(0,0,cvT.width,cvT.height);
      ctx.save();tctx.save();
      if(G.shakeT>0){const sx=rnd(-G.shakeT,G.shakeT)|0,sy=rnd(-G.shakeT,G.shakeT)|0;
        ctx.translate(sx,sy);tctx.translate(sx*SC,sy*SC);G.shakeT=Math.max(0,G.shakeT-dt*18);}
      if(G.scene==="pick")drawPickBg();
      else if(G.scene==="class")drawClass();
      else if(G.scene==="run")drawRun();
      else if(G.scene==="queue")drawQueue();
      else if(G.scene==="menu")drawMenu();
      else if(G.scene==="pay")drawPay();
      else if(G.scene==="tray")drawTray();
      else if(G.scene==="fight")drawFight();
      else if(G.scene==="cut")drawCut();
      else drawEnd();
      ctx.restore();tctx.restore();
    }
    function drawPickBg(){
      P(0,0,CW,180,"#1b2033");P(0,118,CW,62,"#4d4a5e");
      for(let i=0;i<5;i++){P(20+i*68,8,16,4,"#f4d35e");ctx.globalAlpha=.1;P(12+i*68,12,32,20,"#f4d35e");ctx.globalAlpha=1;}
      for(let i=0;i<9;i++)person(10+i*36,100,SHIRTS[i%SHIRTS.length],G.t*3+i,i%2===0);
    }
    function restart(){
      dlgOff();tempT=0;
      G.moral=false;G.held=false;G.pen=0;G.runT=0;G.hits=0;G.totalT=0;G.ending="";G.dish=null;G.spill=0;
      Q.n=0;Q.phase="queue";Q.round=0;Q.susp=0;
      $("tagClass").textContent="第四节：？？？";$("tagChar").textContent="角色：—";
      F.on=false; $("fight").classList.add("hide"); $("fCombo").style.opacity=0;
      G.scene="pick";setScene("选择角色");
      $("hud").classList.add("hide");$("skills").classList.add("hide");$("pick").classList.remove("hide");
      setHint("选择一名角色开始游戏。技能键：<b>Q</b> 大招 · <b>E</b> 二技能");
    }
    $("btnRestart").onclick=e=>{e.stopPropagation();ac();restart();};
    $("btnSound").onclick=e=>{e.stopPropagation();SOUND=!SOUND;$("btnSound").textContent=SOUND?"🔊 音效开":"🔇 音效关";};

    buildPick();fit();setTimeout(fit,80);setTimeout(fit,400);
    G.last=performance.now();requestAnimationFrame(loop);
    </script>
  </body>
</html>
